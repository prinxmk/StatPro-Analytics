name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          add-tools-to-path: true
          set-env: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build\Release\StatProAnalytics.exe").Path
          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"

          if (-not (Test-Path $windeployqt)) {
            throw "windeployqt.exe not found: $windeployqt"
          }

          & $windeployqt --release --compiler-runtime --no-translations $exe

          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

      - name: Verify deployed files
        shell: pwsh
        run: |
          $dir = (Resolve-Path "build\Release").Path

          $required = @(
            "StatProAnalytics.exe",
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll"
          )

          foreach ($name in $required) {
            $p = Join-Path $dir $name
            if (-not (Test-Path $p)) {
              throw "Required deployed file is missing: $p"
            }
            Write-Host "OK: $name"
          }

          foreach ($pluginDir in @("platforms")) {
            $p = Join-Path $dir $pluginDir
            if (-not (Test-Path $p)) {
              throw "Required Qt plugin directory is missing: $p"
            }
            Write-Host "OK: $pluginDir"
          }

          Write-Host "Complete deployed application directory:"
          Get-ChildItem $dir -Recurse | Select-Object FullName,Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\StatPro-Analytics.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Verify installer contents
        shell: pwsh
        run: |
          $installer = (Resolve-Path "Output\StatPro-Analytics-Setup.exe").Path

          if (-not (Test-Path $installer)) {
            throw "Installer was not created."
          }

          Write-Host "Installer:"
          Get-Item $installer | Select-Object FullName,Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: StatPro-Analytics-Setup-v0.1.1
          path: Output/StatPro-Analytics-Setup.exe
          if-no-files-found: error
