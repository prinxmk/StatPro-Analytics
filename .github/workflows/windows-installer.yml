name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          add-tools-to-path: true
          set-env: true

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Verify application
        shell: pwsh
        run: |
          if (-not (Test-Path "build\Release\StatProAnalytics.exe")) {
            Write-Error "StatProAnalytics.exe was not created."
            exit 1
          }

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          windeployqt --release --compiler-runtime "build\Release\StatProAnalytics.exe"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "windeployqt failed."
            exit $LASTEXITCODE
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\StatPro-Analytics.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup failed."
            exit $LASTEXITCODE
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: StatPro-Analytics-Setup
          path: Output/StatPro-Analytics-Setup.exe
          if-no-files-found: error
